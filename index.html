<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiøm — Journal des Voies</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --void: #080610; --deep: #0E0B1A; --surface: #14102A; --panel: #1A1530;
  --border: #2E2550; --gold: #C9A84C; --gold-light: #E8C96A; --gold-dim: #7A5E1A;
  --violet: #7F77DD; --violet-light: #AFA9EC; --violet-dim: #3C3489;
  --text: #E8E4F4; --text-dim: #9B96B8; --text-faint: #514D6E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--void);color:var(--text);font-family:'Crimson Text',Georgia,serif;min-height:100vh;overflow-x:hidden;}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) var(--delay,0s) infinite alternate ease-in-out;}
@keyframes twinkle{from{opacity:.06}to{opacity:.55}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(8,6,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;}
.nav-logo{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.1em;color:var(--gold);}
.nav-tabs{display:flex;gap:.25rem;}
.nav-tab{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:.35rem .75rem;border-radius:6px;border:1px solid transparent;background:none;color:var(--text-faint);cursor:pointer;transition:all .2s;}
.nav-tab.active,.nav-tab:hover{color:var(--gold);border-color:var(--gold-dim);background:rgba(201,168,76,.07);}
.nav-admin-btn{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.06em;padding:.3rem .7rem;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text-faint);cursor:pointer;transition:all .2s;}
.nav-admin-btn:hover{color:var(--violet-light);border-color:var(--violet);}

/* PAGES */
.page{display:none;position:relative;z-index:1;padding-top:66px;min-height:100vh;}
.page.active{display:block;}

/* ═══ CARTE GALAXIE & SURFACE ═══ */
#page-carte{padding:66px 0 2rem;}
.carte-header{text-align:center;padding:2rem 1.25rem 1.5rem;}
.carte-header h1{font-family:'Cinzel',serif;font-size:clamp(22px,5vw,42px);font-weight:700;background:linear-gradient(135deg,var(--gold-light),var(--violet-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;}
.carte-header p{font-size:15px;font-style:italic;color:var(--text-dim);}

.map-container { position: relative; width: 95%; max-width: 1100px; aspect-ratio: 16/10; margin: 0 auto; background: radial-gradient(circle at center, #1A1530 0%, #080610 100%); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.galaxy-view { position: absolute; inset: 0; transition: opacity 0.4s; }
.galaxy-view.hidden { opacity: 0; pointer-events: none; transform: scale(1.1); }
.planet-node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; }
.planet-node:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 10; }
.planet-sphere { border-radius: 50%; background: radial-gradient(circle at 30% 30%, currentColor, transparent 80%); box-shadow: inset -10px -10px 20px rgba(0,0,0,0.6), 0 0 15px currentColor; position: relative; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: rgba(255,255,255,0.8); }
.planet-label { margin-top: 8px; font-family: 'Cinzel', serif; font-size: 11px; color: var(--text); background: rgba(8,6,16,0.85); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); white-space: nowrap; backdrop-filter: blur(4px); text-align: center;}
.pin-status { position: absolute; top: -5px; right: -5px; font-size: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; z-index: 5; }

.surface-view { position: absolute; inset: 0; background: rgba(8,6,16,0.95); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s, transform 0.4s; transform: scale(0.9); z-index: 20; }
.surface-view.active { opacity: 1; pointer-events: auto; transform: scale(1); }
.sv-header { position: absolute; top: 1.5rem; left: 1.5rem; right: 1.5rem; display: flex; justify-content: space-between; align-items: flex-start; z-index: 30; }
.sv-btn { font-family: 'Cinzel', serif; font-size: 10px; text-transform: uppercase; padding: 0.5rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); border-radius: 6px; cursor: pointer; transition: 0.2s; }
.sv-btn:hover { background: rgba(255,255,255,0.1); }
.sv-title { text-align: center; }
.sv-title h2 { font-family: 'Cinzel', serif; font-size: 24px; margin-bottom: 0.2rem; }
.sv-title p { font-size: 12px; color: var(--text-dim); font-style: italic; }
.giant-planet { width: 70%; aspect-ratio: 1; max-width: 500px; border-radius: 50%; position: relative; box-shadow: inset -20px -20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); transition: all 0.5s ease; }
.location-pin { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s; }
.location-pin:hover { transform: translate(-50%, -50%) scale(1.2); z-index: 10; }
.loc-dot { width: 12px; height: 12px; border-radius: 50%; background: white; box-shadow: 0 0 10px white; border: 2px solid var(--void); }
.loc-label { margin-top: 5px; text-align: center; font-family: 'Cinzel', serif; font-size: 11px; background: rgba(0,0,0,0.85); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(2px); white-space: nowrap; }

/* ═══ JOURNAL ═══ */
.journal-header{text-align:center;padding:2rem 1.25rem 1.5rem;}
.journal-header h1{font-family:'Cinzel',serif;font-size:clamp(22px,5vw,42px);font-weight:700;background:linear-gradient(135deg,var(--gold-light),var(--violet-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;}
.journal-header p{font-size:15px;font-style:italic;color:var(--text-dim);}
.journal-list{max-width:720px;margin:0 auto;padding:0 1.25rem;}
.journal-entry{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;overflow:hidden;}
.je-header{padding:.9rem 1.1rem;display:flex;align-items:center;gap:.75rem;cursor:pointer;}
.je-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-hidden{background:var(--text-faint);opacity:.4;}
.dot-rumeur{background:var(--violet);animation:pulse 2s infinite;}
.dot-active{background:var(--gold);}
.dot-complete{background:#2A6B3A;}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.je-title{font-family:'Cinzel',serif;font-size:13px;color:var(--text);flex:1;}
.je-title.rumeur{color:var(--violet-light);}
.je-title.complete{color:#4A9B5A;}
.je-meta{font-size:11px;color:var(--text-faint);}
.je-chevron{font-size:12px;color:var(--text-faint);transition:transform .2s;}
.je-body{display:none;padding:0 1.1rem 1rem;border-top:1px solid var(--border);}
.je-body.open{display:block;}
.je-desc{font-size:15px;color:var(--text-dim);line-height:1.75;margin-top:.75rem;}
.je-hint{font-size:13px;font-style:italic;color:var(--violet-light);margin-top:.6rem;padding:.5rem .8rem;border-left:2px solid var(--violet);background:rgba(127,119,221,.07);border-radius:0 6px 6px 0;}
.je-prereqs{margin-top:.6rem;}
.prereq-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:.3rem;}
.prereq-item{font-size:13px;color:var(--text-dim);padding:.2rem 0;}
.prereq-item::before{content:'→ ';color:var(--gold-dim);}
.je-complete-badge{display:inline-block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:.25rem .7rem;border-radius:99px;background:rgba(42,107,58,.25);border:1px solid #2A6B3A;color:#4A9B5A;margin-top:.75rem;}
.filter-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem;}
.filter-btn{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .75rem;border-radius:99px;border:1px solid var(--border);background:none;color:var(--text-faint);cursor:pointer;transition:all .2s;}
.filter-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.08);}

/* ═══ TABLEAU ═══ */
#page-tableau{padding:66px 0 2rem;}
.tableau-header{text-align:center;padding:2rem 1.25rem 1.5rem;}
.tableau-header h1{font-family:'Cinzel',serif;font-size:clamp(22px,5vw,42px);font-weight:700;background:linear-gradient(135deg,var(--gold-light),var(--violet-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;}
.stats-row{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;margin-bottom:2rem;}
.stat-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.75rem 1.2rem;text-align:center;min-width:100px;}
.stat-num{font-family:'Cinzel',serif;font-size:26px;color:var(--gold);}
.stat-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-top:.2rem;}
.tableau-section{max-width:900px;margin:0 auto;padding:0 1.25rem 1.5rem;}
.ts-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);margin-bottom:.75rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);}
.tableau-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.75rem;}
.tq-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;}
.tq-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;}
.tq-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tq-name{font-family:'Cinzel',serif;font-size:12px;color:var(--text);}
.tq-royaume{font-size:11px;color:var(--text-faint);font-style:italic;}
.tq-diff{font-size:11px;color:var(--text-faint);margin-top:.3rem;}

/* ═══ ADMIN ═══ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,6,16,.92);z-index:200;align-items:center;justify-content:center;padding:1.25rem;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--violet);border-radius:18px;padding:1.75rem;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 0 50px rgba(127,119,221,.2);}
.modal h2{font-family:'Cinzel',serif;font-size:18px;color:var(--gold);margin-bottom:1.25rem;}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--border);color:var(--text-dim);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;}
.modal-close:hover{border-color:var(--violet);color:var(--text);}
.admin-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.5rem .8rem;color:var(--text);font-family:'Crimson Text',serif;font-size:14px;outline:none;}
.btn-primary{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:.65rem 1.5rem;background:linear-gradient(135deg,var(--violet-dim),var(--violet));color:white;border:none;border-radius:8px;cursor:pointer;}
.admin-quete-row{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;margin-bottom:.5rem;background:var(--surface);flex-wrap:wrap;}
.aqr-name{flex:1;font-size:14px;color:var(--text-dim);min-width:120px;}
.aqr-status{font-family:'Cinzel',serif;font-size:10px;padding:.2rem .6rem;border-radius:99px;}
.status-hidden{background:rgba(81,77,110,.3);color:var(--text-faint);border:1px solid var(--text-faint);}
.status-rumeur{background:rgba(127,119,221,.2);color:var(--violet-light);border:1px solid var(--violet);}
.status-active{background:rgba(201,168,76,.15);color:var(--gold);border:1px solid var(--gold-dim);}
.status-complete{background:rgba(26,92,42,.3);color:#70C080;border:1px solid #1A5C2A;}
.status-disabled{background:rgba(139,32,32,.2);color:#E07070;border:1px solid #8B2020;}
.aqr-btns{display:flex;gap:.35rem;}
.aqr-btn{font-family:'Cinzel',serif;font-size:9px;padding:.3rem .5rem;border-radius:5px;border:1px solid var(--border);background:none;color:var(--text-faint);cursor:pointer;}
.aqr-btn.active-btn{color:var(--gold);border-color:var(--gold-dim);background:rgba(201,168,76,.08);}
.admin-section-title{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin:1.5rem 0 1rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);}
.error-msg{font-size:13px;color:#E07070;margin-top:.4rem;font-style:italic;}

/* NOTIFICATION */
#saveNotif {
  display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background-color: #FFD700; color: #080610; padding: 12px 24px; border-radius: 8px;
  font-family: 'Cinzel', serif; font-weight: bold; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em;
  box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); z-index: 9999;
}

@media(max-width:700px){
  .map-container { aspect-ratio: 1/1.2; }
  .giant-planet { width: 90%; }
}
</style>
</head>
<body>
<div id="stars"></div>

<nav>
  <span class="nav-logo">Axiøm</span>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('carte')">🗺️ Carte</button>
    <button class="nav-tab" onclick="showPage('journal')">📖 Journal</button>
    <button class="nav-tab" onclick="showPage('tableau')">📋 Tableau</button>
  </div>
  <button class="nav-admin-btn" onclick="openAdmin()">⚙️</button>
</nav>

<!-- ═══ CARTE ═══ -->
<div class="page active" id="page-carte">
  <div class="carte-header">
    <h1>Carte de la Galaxie</h1>
    <p>Explorez les territoires. Cliquez sur une planète pour l'examiner.</p>
  </div>
  <div class="map-container" id="map-container">
    <div class="galaxy-view" id="galaxy-view"></div>
    <div class="surface-view" id="surface-view">
      <div class="sv-header">
        <button class="sv-btn" onclick="closePlanet()">⟵ Retour</button>
        <div class="sv-title">
          <h2 id="sv-name">Nom</h2>
          <p id="sv-god">Dieu</p>
        </div>
        <button class="sv-btn" id="sv-quest-btn" style="color:var(--gold); border-color:var(--gold-dim);">Quêtes ▾</button>
      </div>
      <div class="giant-planet" id="giant-planet"></div>
    </div>
  </div>
</div>

<!-- ═══ JOURNAL ═══ -->
<div class="page" id="page-journal">
  <div class="journal-header">
    <h1>Journal des Voies</h1>
    <p>Ce que vous avez découvert. Ce que vous cherchez encore.</p>
  </div>
  <div class="journal-list">
    <div class="filter-row" id="filter-row"></div>
    <div id="journal-list-content"></div>
  </div>
</div>

<!-- ═══ TABLEAU ═══ -->
<div class="page" id="page-tableau">
  <div class="tableau-header">
    <h1>Tableau de Bord</h1>
  </div>
  <div style="max-width:900px;margin:0 auto;padding:0 1.25rem;">
    <div class="stats-row" id="stats-row"></div>
  </div>
  <div id="tableau-content"></div>
</div>

<!-- ═══ MODAL ADMIN — LOGIN ═══ -->
<div class="modal-overlay" id="modal-login">
  <div class="modal" style="max-width:380px;">
    <button class="modal-close" onclick="closeModal('modal-login')">×</button>
    <h2>Accès Admin</h2>
    <input class="admin-input" type="password" id="admin-pwd" placeholder="Mot de passe…" style="margin-bottom: 1rem;" onkeydown="if(event.key==='Enter')checkPwd()">
    <button class="btn-primary" onclick="checkPwd()">Entrer</button>
    <p class="error-msg" id="pwd-error" style="display:none;">Mot de passe incorrect.</p>
  </div>
</div>

<!-- ═══ MODAL ADMIN — PANNEAU ═══ -->
<div class="modal-overlay" id="modal-admin">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-admin')">×</button>
    <h2>⚙️ Panneau Admin</h2>
    <div id="admin-panel-content"></div>
  </div>
</div>

<!-- ═══ NOTIFICATION SAUVEGARDE ═══ -->
<div id="saveNotif">✓ Modification enregistrée</div>

<script>
// ══════════════════════════════════════════

  { id: 'entreterre', nom: 'Entre-Terre', icon: '🩸', sub: 'Ordre Brisé — Marika', dieu: 'Marika', color: '#8B2020', size: 55, x: 50, y: 70, lieux: ['Leyndell', 'Manoir du Lion Rouge', 'Palais de l\'Empaleur', 'Dynastie Mohgwyn', 'Table Ronde'] },
  { id: 'sugarland', nom: 'Sugar Land', icon: '🍭', sub: 'Royaume Sucré', dieu: 'Inconnu', color: '#FFB6C1', size: 50, x: 30, y: 25, lieux: ['Palais de Sucre', 'Forêt de Guimauve'] }
];

// ══════════════════════════════════════════
// DATA — QUÊTES
// ══════════════════════════════════════════

const BIN_ID = '6a876da9da38895dfefcf1c8';
const API_KEY = '$2a$10$U4rbBQQTpeVgGtfOzA493uopHCK5m19wkdSFCVZ2YASy01xuPMKhq';
const ADMIN_PWD = 'fromage';
const LOCAL_KEY = 'pantheon_data_cloud_v6';

let quetesState = {};
let questCharsState = {};
let locationsState = {};
let activeFilter = 'all';
let activeTypeFilter = 'all';

async function loadState() {
  const local = localStorage.getItem(LOCAL_KEY);
  if (local) { 
    try { 
      const parsed = JSON.parse(local); 
      if (parsed.quetesState) quetesState = parsed.quetesState;
      if (parsed.questCharsState) questCharsState = parsed.questCharsState;
      if (parsed.locationsState) locationsState = parsed.locationsState;
    } catch(e){} 
  }
  
  QUETES_DATA.forEach(q => { if (!quetesState[q.id]) quetesState[q.id] = 'hidden'; });
  renderAll();
  
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
    if (res.ok) {
      const data = await res.json();
      if (data.record) {
        if (data.record.quetesState) quetesState = data.record.quetesState;
        if (data.record.questCharsState) questCharsState = data.record.questCharsState;
        if (data.record.locationsState) locationsState = data.record.locationsState;
        localStorage.setItem(LOCAL_KEY, JSON.stringify({quetesState, questCharsState, locationsState}));
        renderAll();
      }
    }
  } catch (err) { console.log('Erreur cloud', err); }
}

async function saveState() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify({quetesState, questCharsState, locationsState}));
  
  // Affiche la notification jaune
  const notif = document.getElementById('saveNotif');
  notif.style.display = 'block';
  setTimeout(() => { notif.style.display = 'none'; }, 3000);

  try {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify({ quetesState, questCharsState, locationsState, lastUpdate: new Date().toISOString() })
    });
  } catch(e) { console.log('Erreur de sauvegarde cloud', e); }
}

function renderGalaxie() {
  const galaxyView = document.getElementById('galaxy-view');
  galaxyView.innerHTML = '';
  
  ZONES_DATA.forEach(z => {
    const quetes = QUETES_DATA.filter(q => q.royaume === z.id);
    const actives = quetes.filter(q => quetesState[q.id] === 'active').length;
    const rumeurs = quetes.filter(q => quetesState[q.id] === 'rumeur').length;
    
    let badge = '';
    if (actives > 0) badge = `<div class="pin-status" style="color:var(--gold); border-color:var(--gold);">${actives}</div>`;
    else if (rumeurs > 0) badge = `<div class="pin-status" style="color:var(--violet); border-color:var(--violet);">?</div>`;

    const node = document.createElement('div');
    node.className = 'planet-node';
    node.style.left = z.x + '%'; node.style.top = z.y + '%';
    node.style.color = z.color;
    node.onclick = () => openPlanet(z);
    node.innerHTML = `${badge}<div class="planet-sphere" style="width:${z.size}px; height:${z.size}px; background-color:${z.color}33;">${z.icon}</div><div class="planet-label">${z.nom}</div>`;
    galaxyView.appendChild(node);
  });
}

function openPlanet(zone) {
  document.getElementById('galaxy-view').classList.add('hidden');
  const surface = document.getElementById('surface-view');
  document.getElementById('sv-name').textContent = zone.nom;
  document.getElementById('sv-name').style.color = zone.color;
  document.getElementById('sv-god').textContent = zone.dieu !== 'Inconnu' ? zone.dieu : '';
  
  const giant = document.getElementById('giant-planet');
  giant.style.backgroundColor = `${zone.color}22`;
  giant.style.boxShadow = `inset -20px -20px 50px rgba(0,0,0,0.8), 0 0 100px ${zone.color}44`;
  giant.innerHTML = ''; 
  
  zone.lieux.forEach((lieu, index) => {
    const angle = (index / zone.lieux.length) * Math.PI * 2;
    const radius = 35;
    const pin = document.createElement('div');
    pin.className = 'location-pin';
    pin.style.left = (50 + radius * Math.cos(angle)) + '%';
    pin.style.top = (50 + radius * Math.sin(angle)) + '%';
    
    const charsHere = locationsState[`${zone.id}|${lieu}`];
    const charsHtml = charsHere ? `<div style="color:var(--gold); font-size:10px; margin-top:2px;">[ ${charsHere} ]</div>` : '';

    pin.innerHTML = `<div class="loc-dot" style="background:${zone.color}; box-shadow:0 0 10px ${zone.color}"></div><div class="loc-label">${lieu}${charsHtml}</div>`;
    giant.appendChild(pin);
  });
  
  const questBtn = document.getElementById('sv-quest-btn');
  if(QUETES_DATA.filter(q => q.royaume === zone.id).length > 0) {
    questBtn.style.display = 'inline-block';
    questBtn.onclick = () => { closePlanet(); showPage('journal'); setFilter(zone.id); };
  } else {
    questBtn.style.display = 'none';
  }

  surface.classList.add('active');
}

function closePlanet() {
  document.getElementById('surface-view').classList.remove('active');
  document.getElementById('galaxy-view').classList.remove('hidden');
}

// RENDER JOURNAL & TABLEAU
// ══════════════════════════════════════════
function dotClass(state) {
  if (state === 'rumeur') return 'dot-rumeur';
  if (state === 'active') return 'dot-active';
  if (state === 'complete') return 'dot-complete';
  return 'dot-hidden';
}

function setFilter(f) { activeFilter = f; renderJournal(); }

function renderJournal() {
  const fr = document.getElementById('filter-row');
  const list = document.getElementById('journal-list-content');
  const filters = [{id:'all',label:'Toutes'}, {id:'principale',label:'Principales'}, {id:'secondaire',label:'Secondaires'}, {id:'active',label:'En cours'}, {id:'complete',label:'Terminées'}];
  
  fr.innerHTML = filters.map(f => `<button class="filter-btn ${activeTypeFilter===f.id?'active':''}" onclick="activeTypeFilter='${f.id}'; activeFilter='all'; renderJournal();">${f.label}</button>`).join('');

  const visible = QUETES_DATA.filter(q => {
    const st = quetesState[q.id];
    if (st === 'hidden' || st === 'disabled') return false;
    if (activeFilter !== 'all' && q.royaume !== activeFilter) return false;
    if (activeTypeFilter === 'principale' && q.type !== 'principale') return false;
    if (activeTypeFilter === 'secondaire' && q.type !== 'secondaire') return false;
    if (activeTypeFilter === 'active' && st !== 'active') return false;
    if (activeTypeFilter === 'complete' && st !== 'complete') return false;
    return true;
  });

  if (visible.length === 0) { list.innerHTML = '<p style="font-size:15px;color:var(--text-faint);font-style:italic;text-align:center;padding:2rem;">Aucune entrée trouvée.</p>'; return; }
  
  list.innerHTML = visible.map(q => {
    const st = quetesState[q.id];
    const r = ZONES_DATA.find(x=>x.id===q.royaume);
    const nom = st==='rumeur' ? 'Rumeur inconnue…' : q.nom;
    
    let charsHtml = '';
    if(questCharsState[q.id] && st!=='rumeur') {
      charsHtml = `<div style="margin-top:0.8rem; font-size:13px; color:var(--gold); border-left:2px solid var(--gold); padding-left:0.5rem;"><span style="color:var(--text-faint)">Impliqués :</span> ${questCharsState[q.id]}</div>`;
    }

    const desc = st==='rumeur' ? `<p class="je-desc" style="font-style:italic;color:var(--violet-light);">${q.rumeur}</p>` : `<p class="je-desc">${q.desc}</p>${q.hint?`<p class="je-hint">💡 ${q.hint}</p>`:''}`;
    const prereqHtml = (q.prereqs.length>0 && st!=='rumeur') ? `<div class="je-prereqs"><p class="prereq-label">Prérequis</p>${q.prereqs.map(p=>`<div class="prereq-item">${p}</div>`).join('')}</div>`:'';
    return `
      <div class="journal-entry">
        <div class="je-header" onclick="toggleEntry('je-${q.id}',this)">
          <div class="je-status ${dotClass(st)}"></div>
          <div class="je-title ${st==='rumeur'?'rumeur':st==='complete'?'complete':''}">${nom}</div>
          <span class="je-meta">${r?r.icon+' '+r.nom:''}</span>
          <span class="je-chevron">▾</span>
        </div>
        <div class="je-body" id="je-${q.id}">${desc}${charsHtml}${prereqHtml}${st==='complete'?'<span class="je-complete-badge">✓ Terminée</span>':''}</div>
      </div>`;
  }).join('');
}

function toggleEntry(id, header) {
  const body = document.getElementById(id);
  const open = body.classList.toggle('open');
  header.querySelector('.je-chevron').style.transform = open?'rotate(180deg)':'';
}

function renderTableau() {
  const actives = QUETES_DATA.filter(q=>quetesState[q.id]==='active'||quetesState[q.id]==='rumeur');
  const completes = QUETES_DATA.filter(q=>quetesState[q.id]==='complete');
  const hidden = QUETES_DATA.filter(q=>quetesState[q.id]==='hidden'||quetesState[q.id]==='disabled');
  const total = QUETES_DATA.filter(q=>quetesState[q.id]!=='disabled').length;
  const pct = total>0?Math.round(completes.length/total*100):0;

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-box"><div class="stat-num">${actives.length}</div><div class="stat-label">En cours</div></div>
    <div class="stat-box"><div class="stat-num">${completes.length}</div><div class="stat-label">Terminées</div></div>
    <div class="stat-box"><div class="stat-num">${hidden.length}</div><div class="stat-label">Inconnues</div></div>
    <div class="stat-box"><div class="stat-num">${pct}%</div><div class="stat-label">Progression</div></div>`;

  const tc = document.getElementById('tableau-content');
  tc.innerHTML = '';
  
  function section(title, quetes, dotCls) {
    if (!quetes.length) return;
    tc.innerHTML += `<div class="tableau-section"><div class="ts-title">${title}</div><div class="tableau-grid">${
      quetes.map(q=>{
        const r = ZONES_DATA.find(x=>x.id===q.royaume);
        const chars = questCharsState[q.id] ? `<div style="font-size:10px; color:var(--gold); margin-top:0.3rem;">👥 ${questCharsState[q.id]}</div>` : '';
        return `<div class="tq-card"><div class="tq-top"><div class="tq-dot ${dotCls}"></div><span class="tq-name">${q.nom}</span></div><div class="tq-royaume">${r?r.icon+' '+r.nom:''}</div><div class="tq-diff">${q.diff} · ${q.type}</div>${chars}</div>`;
      }).join('')
    }</div></div>`;
  }
  section('Quêtes en cours', actives.filter(q=>quetesState[q.id]==='active'), 'dot-active');
  section('Rumeurs', actives.filter(q=>quetesState[q.id]==='rumeur'), 'dot-rumeur');
  section('Terminées', completes, 'dot-complete');
}

function renderAll() { 
  renderGalaxie(); 
  renderJournal(); 
  renderTableau(); 
  if(document.getElementById('modal-admin').classList.contains('open')) renderAdminPanel(); 
}

function renderAdminPanel() {
  const content = document.getElementById('admin-panel-content');
  let html = '';
  ZONES_DATA.forEach(r => {
    html += `<div class="admin-section-title">${r.icon} ${r.nom}</div>`;
    
    // GESTION DES LIEUX (SOUS-ZONES)
    if (r.lieux && r.lieux.length > 0) {
      html += `<div style="margin-bottom: 1rem; padding: 0.8rem; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--border);">`;
      html += `<div style="font-size: 10px; color: var(--gold-dim); margin-bottom: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;">▶ Présences par Sous-Zone</div>`;
      r.lieux.forEach(lieu => {
        const locKey = `${r.id}|${lieu}`;
        const currentChars = locationsState[locKey] || '';
        html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.4rem; flex-wrap: wrap; gap: 0.5rem;">
                   <span style="font-size: 13px; color: var(--text-dim);">${lieu}</span>
                   <input type="text" class="admin-input" style="width: 250px; padding: 0.4rem 0.6rem;" placeholder="Persos présents (ex: Bob, Alice)..." value="${currentChars}" onchange="updateLocation('${locKey}', this.value)">
                 </div>`;
      });
      html += `</div>`;
    }

    // GESTION DES QUETES
    const qs = QUETES_DATA.filter(q=>q.royaume===r.id);
    if (qs.length > 0) {
      html += `<div style="font-size: 10px; color: var(--gold-dim); margin-bottom: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;">▶ État des Quêtes</div>`;
      qs.forEach(q => {
        const st = quetesState[q.id]||'hidden';
        const chars = questCharsState[q.id]||'';
        const states = ['hidden','rumeur','active','complete','disabled'];
        const labels = {hidden:'Cachée',rumeur:'Rumeur',active:'Active',complete:'Terminée',disabled:'Désactivée'};
        const statusCls = {hidden:'status-hidden',rumeur:'status-rumeur',active:'status-active',complete:'status-complete',disabled:'status-disabled'};
        const btns = states.map(s=>`<button class="aqr-btn ${st===s?'active-btn':''}" onclick="setQueteState('${q.id}','${s}')">${labels[s]}</button>`).join('');
        
        html += `<div class="admin-quete-row" style="flex-direction: column; align-items: stretch;">
                   <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; flex-wrap:wrap;">
                     <span class="aqr-name">${q.nom}</span>
                     <span class="aqr-status ${statusCls[st]}">${labels[st]}</span>
                   </div>
                   <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                     <input type="text" class="admin-input" style="width: 200px; padding: 0.4rem 0.6rem; font-size: 12px;" placeholder="Impliqués dans la quête..." value="${chars}" onchange="updateQuestChars('${q.id}', this.value)">
                     <div class="aqr-btns">${btns}</div>
                   </div>
                 </div>`;
      });
    }
  });
  content.innerHTML = html;
}

function setQueteState(id, state) { quetesState[id] = state; saveState(); renderAll(); }
function updateQuestChars(id, chars) { questCharsState[id] = chars; saveState(); renderAll(); }
function updateLocation(locKey, chars) { locationsState[locKey] = chars; saveState(); renderAll(); }

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════
function showPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>{ if(t.textContent.toLowerCase().includes(name.slice(0,4))) t.classList.add('active'); });
  if (name==='journal') renderJournal();
  if (name==='tableau') renderTableau();
}

function openAdmin() { document.getElementById('modal-login').classList.add('open'); document.getElementById('admin-pwd').focus(); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); document.getElementById('admin-pwd').value=''; document.getElementById('pwd-error').style.display='none'; }

function checkPwd() {
  if (document.getElementById('admin-pwd').value === ADMIN_PWD) {
    closeModal('modal-login'); renderAdminPanel(); document.getElementById('modal-admin').classList.add('open');
  } else { document.getElementById('pwd-error').style.display='block'; document.getElementById('admin-pwd').value=''; document.getElementById('admin-pwd').focus(); }
}

(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<90;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*6}s`;
    c.appendChild(s);
  }
})();

loadState();
</script>
