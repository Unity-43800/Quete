<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiøm — Journal des Voies</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
--void:#080610;--deep:#0E0B1A;--surface:#14102A;--panel:#1A1530;
--border:#2E2550;--gold:#C9A84C;--gold-light:#E8C96A;--gold-dim:#7A5E1A;
--violet:#7F77DD;--violet-light:#AFA9EC;--violet-dim:#3C3489;
--text:#E8E4F4;--text-dim:#9B96B8;--text-faint:#514D6E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--void);color:var(--text);font-family:'Crimson Text',Georgia,serif;min-height:100vh;overflow-x:hidden;}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) var(--delay,0s) infinite alternate ease-in-out;}
@keyframes twinkle{from{opacity:.06}to{opacity:.55}}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(8,6,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;}
.nav-logo{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.1em;color:var(--gold);}
.nav-tabs{display:flex;gap:.2rem;}
.nav-tab{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .6rem;border-radius:6px;border:1px solid transparent;background:none;color:var(--text-faint);cursor:pointer;transition:all .2s;}
.nav-tab.active,.nav-tab:hover{color:var(--gold);border-color:var(--gold-dim);background:rgba(201,168,76,.07);}
.nav-admin-btn{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.06em;padding:.3rem .7rem;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text-faint);cursor:pointer;transition:all .2s;}
.nav-admin-btn:hover{color:var(--violet-light);border-color:var(--violet);}
.page{display:none;position:relative;z-index:1;padding-top:66px;min-height:100vh;}
.page.active{display:block;}
.page-h{text-align:center;padding:2rem 1.25rem 1.5rem;}
.page-h h1{font-family:'Cinzel',serif;font-size:clamp(22px,5vw,42px);font-weight:700;background:linear-gradient(135deg,var(--gold-light),var(--violet-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;}
.page-h p{font-size:15px;font-style:italic;color:var(--text-dim);}

/* CARTE INTERACTIVE */
#page-carte{padding:66px 0 2rem;}
.interactive-map {
  position: relative;
  width: 95%;
  max-width: 1100px;
  aspect-ratio: 16/10;
  margin: 0 auto;
  background: radial-gradient(circle at center, #1A1530 0%, #080610 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.map-bg-img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.4;
  pointer-events: none;
  transition: transform 0.5s ease;
}
.interactive-map.zoomed .map-bg-img { transform: scale(1.1); filter: blur(4px); opacity: 0.2; }
#map-pins-container { transition: opacity 0.3s ease, transform 0.5s ease; }
.interactive-map.zoomed #map-pins-container { opacity: 0; pointer-events: none; transform: scale(1.1); }
.map-pin { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s ease; z-index: 2; }
.map-pin:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 10; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; background: currentColor; box-shadow: 0 0 15px currentColor; border: 2px solid var(--void); position: relative; }
.pin-dot::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid currentColor; opacity: 0.5; animation: pulse 2s infinite; }
.pin-label { margin-top: 8px; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.05em; color: var(--text); background: rgba(8,6,16,0.85); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); white-space: nowrap; backdrop-filter: blur(4px); }
.pin-status { position: absolute; top: -8px; right: -12px; font-size: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

/* ZOOM OVERLAY */
.map-zoom-overlay {
  position: absolute;
  inset: 0;
  background: rgba(8,6,16,0.85);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  padding: 2rem;
  opacity: 0;
  pointer-events: none;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  transform: scale(0.95);
  z-index: 20;
}
.map-zoom-overlay.active { opacity: 1; pointer-events: auto; transform: scale(1); }
.zoom-header-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; }
.btn-back { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.4rem 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
.btn-back:hover { background: rgba(255,255,255,0.1); color: var(--text); border-color: var(--text-faint); }
.btn-quests { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.5rem 1rem; background: rgba(201,168,76,0.15); border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 6px; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 15px rgba(201,168,76,0.1); }
.btn-quests:hover { background: var(--gold); color: var(--void); box-shadow: 0 0 20px rgba(201,168,76,0.4); }
.zoom-title-container { text-align: center; flex: 1; }
.zoom-icon { font-size: 42px; margin-bottom: 0.5rem; text-shadow: 0 0 20px currentColor; }
.zoom-title { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 700; color: currentColor; margin-bottom: 0.2rem; }
.zoom-subtitle { font-size: 14px; font-style: italic; color: var(--text-dim); }
.zoom-lieux-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; overflow-y: auto; padding-bottom: 1rem; }
.zoom-lieu-card { background: rgba(20,16,42,0.6); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; display: flex; align-items: center; gap: 0.75rem; font-size: 14px; color: var(--text); transition: background 0.2s; }
.zoom-lieu-card:hover { background: rgba(255,255,255,0.05); border-color: currentColor; }
.zoom-lieu-card::before { content: '✦'; font-size: 10px; opacity: 0.5; color: currentColor; }

/* JOURNAL, TABLEAU & AUTRES STYLES IDENTIQUES... */
#page-journal, #page-tableau, #page-zones{padding:66px 0 2rem;}
.journal-entry{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;overflow:hidden;}
.je-header{padding:.9rem 1.1rem;display:flex;align-items:center;gap:.75rem;cursor:pointer;}
.je-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-hidden{background:var(--text-faint);opacity:.4;}
.dot-rumeur{background:var(--violet);animation:pulse 2s infinite;}
.dot-active{background:var(--gold);}
.dot-complete{background:#2A6B3A;}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.je-title{font-family:'Cinzel',serif;font-size:13px;color:var(--text);flex:1;}
.je-title.rumeur{color:var(--violet-light);}
.je-title.complete{color:#4A9B5A;}
.je-meta{font-size:11px;color:var(--text-faint);}
.je-chevron{font-size:12px;color:var(--text-faint);transition:transform .2s;}
.je-body{display:none;padding:0 1.1rem 1rem;border-top:1px solid var(--border);}
.je-body.open{display:block;}
.je-desc{font-size:15px;color:var(--text-dim);line-height:1.75;margin-top:.75rem;}
.je-hint{font-size:13px;font-style:italic;color:var(--violet-light);margin-top:.6rem;padding:.5rem .8rem;border-left:2px solid var(--violet);background:rgba(127,119,221,.07);border-radius:0 6px 6px 0;}
.je-persos{font-size:13px;color:var(--gold-light);margin-top:.6rem;padding:.5rem .8rem;background:rgba(201,168,76,.06);border-left:2px solid var(--gold-dim);border-radius:0 6px 6px 0;}
.filter-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem;}
.filter-btn{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .75rem;border-radius:99px;border:1px solid var(--border);background:none;color:var(--text-faint);cursor:pointer;transition:all .2s;}
.filter-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.08);}

.zones-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;max-width:1100px;margin:0 auto;padding:0 1.25rem;}
.zone-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.zone-header{padding:.9rem 1.1rem .6rem;display:flex;align-items:center;gap:.75rem;border-bottom:1px solid var(--border);}
.zone-icon{font-size:24px;flex-shrink:0;}
.zone-name{font-family:'Cinzel',serif;font-size:13px;}
.zone-dieu{font-size:11px;color:var(--text-faint);font-style:italic;}
.zone-lieux{padding:.6rem 1.1rem .9rem;}
.zone-lieu{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid rgba(46,37,80,.4);font-size:13px;color:var(--text-dim);}
.zone-lieu:last-child{border-bottom:none;}

/* ADMIN MODALS IDENTIQUES */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,6,16,.92);z-index:200;align-items:center;justify-content:center;padding:1.25rem;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--violet);border-radius:18px;padding:1.75rem;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;position:relative;}
.modal h2{font-family:'Cinzel',serif;font-size:18px;color:var(--gold);margin-bottom:1.25rem;}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--border);color:var(--text-dim);width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.admin-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.65rem .9rem;color:var(--text);font-family:'Crimson Text',serif;font-size:16px;outline:none;margin-bottom:.75rem;}
.btn-primary{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:.65rem 1.5rem;background:linear-gradient(135deg,var(--violet-dim),var(--violet));color:white;border:none;border-radius:8px;cursor:pointer;}
.admin-quete-row{display:flex;flex-direction:column;gap:.5rem;padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;margin-bottom:.5rem;background:var(--surface);}
.aqr-top{display:flex;align-items:center;gap:.6rem;width:100%;}
.aqr-name{flex:1;font-size:14px;color:var(--text-dim);}
.aqr-btns{display:flex;gap:.35rem;flex-wrap:wrap;}
.aqr-btn{font-family:'Cinzel',serif;font-size:9px;text-transform:uppercase;padding:.25rem .5rem;border-radius:5px;border:1px solid var(--border);background:none;color:var(--text-faint);cursor:pointer;}
.aqr-btn.active-btn{color:var(--gold);border-color:var(--gold-dim);background:rgba(201,168,76,.15);}
.admin-perso-input{width:100%;background:var(--void);border:1px solid var(--border);border-radius:6px;padding:.4rem .6rem;color:var(--text);outline:none;}
.admin-section-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-faint);margin:1.25rem 0 .6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);}

@media(max-width:700px){
  .interactive-map { aspect-ratio: 1/1.2; }
  .zoom-header-bar { flex-direction: column; align-items: center; gap: 1rem; }
  .btn-back, .btn-quests { width: 100%; text-align: center; }
  .zoom-icon { font-size: 32px; }
  .zoom-title { font-size: 22px; }
  .zoom-lieux-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="stars"></div>
<nav>
  <span class="nav-logo">Axiøm</span>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('carte')">🗺 Carte</button>
    <button class="nav-tab" onclick="showPage('journal')">📖 Journal</button>
    <button class="nav-tab" onclick="showPage('zones')">🗾 Zones</button>
  </div>
  <button class="nav-admin-btn" onclick="openAdmin()">⚙</button>
</nav>

<!-- CARTE INTERACTIVE AVEC ZOOM -->
<div class="page active" id="page-carte">
  <div class="page-h">
    <h1>Carte des Royaumes</h1>
    <p>Sélectionnez une planète pour explorer ses lieux.</p>
  </div>
  <div class="interactive-map" id="interactive-map">
    <!-- Image de fond optionnelle -->
    <!-- <img src="image.png" class="map-bg-img" alt="Fond galactique"> -->
    
    <div id="map-pins-container"></div>
    
    <!-- CALQUE DE ZOOM (Caché par défaut) -->
    <div id="map-zoom-overlay" class="map-zoom-overlay">
      <div class="zoom-header-bar">
        <button class="btn-back" onclick="closeMapZoom()">⟵ Retour à la galaxie</button>
        <div class="zoom-title-container">
          <div class="zoom-icon" id="zoom-icon">🏛</div>
          <div class="zoom-title" id="zoom-title">Axiøm</div>
          <div class="zoom-subtitle" id="zoom-subtitle">Kenjaku · Imu</div>
        </div>
        <button class="btn-quests" id="btn-zoom-quests">Consulter les quêtes</button>
      </div>
      <div class="zoom-lieux-grid" id="zoom-lieux-grid">
        <!-- Rempli en JS -->
      </div>
    </div>
  </div>
</div>

<!-- JOURNAL -->
<div class="page" id="page-journal">
  <div class="page-h"><h1>Journal des Voies</h1></div>
  <div style="max-width:720px;margin:0 auto;padding:0 1.25rem 1rem;">
    <div class="filter-row" id="filter-row"></div>
    <div id="journal-list"></div>
  </div>
</div>

<!-- ZONES -->
<div class="page" id="page-zones">
  <div class="page-h"><h1>Index des Zones</h1></div>
  <div class="zones-grid" id="zones-grid"></div>
</div>

<!-- ADMIN MODALS -->
<div class="modal-overlay" id="modal-login"><div class="modal" style="max-width:380px;"><button class="modal-close" onclick="closeModal('modal-login')">×</button><h2>Accès Admin</h2><input class="admin-input" type="password" id="admin-pwd" placeholder="Mot de passe…" onkeydown="if(event.key==='Enter')checkPwd()"><button class="btn-primary" onclick="checkPwd()">Entrer</button><p class="error-msg" id="pwd-error" style="display:none;color:#E07070;font-size:13px;margin-top:.4rem;">Erreur.</p></div></div>
<div class="modal-overlay" id="modal-admin"><div class="modal"><button class="modal-close" onclick="closeModal('modal-admin')">×</button><h2>⚙ Panneau Admin</h2><div id="sync-status" style="font-size:11px;color:var(--gold);margin-bottom:1rem;"></div><div id="admin-panel-content"></div></div></div>

<script>
const BIN_ID = '6a876da9da38895dfefcf1c8';
const API_KEY = '$2a$10$U4rbBQQTpeVgGtfOzA493uopHCK5m19wkdSFCVZ2YASy01xuPMKhq';
const ADMIN_PWD = 'fromage';
const LOCAL_KEY = 'pantheon_quetes_cloud_v3';

// ETOILES
const container = document.getElementById('stars');
for(let i=0;i<80;i++){
  const s=document.createElement('div');s.className='star';
  s.style.width=Math.random()*2+1+'px';s.style.height=s.style.width;
  s.style.top=Math.random()*100+'%';s.style.left=Math.random()*100+'%';
  s.style.setProperty('--d',Math.random()*3+2+'s');
  container.appendChild(s);
}

// DONNEES UNIFIEES
const ZONES_DATA = [
  {id:'axiom', nom:'Axiøm', icon:'🏛', dieu:'Kenjaku · Imu', color:'#7F77DD', x:50, y:40, lieux:['Palais royal','Cour dorée (jardin d\'Imu)','Forge souterraine (Radagon)','Place originelle','Citadelle des dieux','Pavillon professionnel','Quartier administratif (43)']},
  {id:'akropis', nom:'Akropis', icon:'⚔', dieu:'Ju Fa · Destruction', color:'#C94A4A', x:20, y:45, lieux:['Palais royal','Place des exécutions','Arène','Aile des serviteurs','Onigashima (Kaido)']},
  {id:'sugarland', nom:'Sugar Land', icon:'🍯', dieu:'Gojo · Préservation', color:'#4A8BC9', x:30, y:20, lieux:['Palais','Prairie du miel','Temple des gâteaux']},
  {id:'allpink', nom:'All Pink', icon:'🌿', dieu:'Tao Fa · Abondance', color:'#4AC97A', x:15, y:20, lieux:['Hôpital','Palais','Jardin des bénédictions (Nirumu)']},
  {id:'atlantis', nom:'Atlantis', icon:'🧠', dieu:'Gui Fa · Érudition', color:'#4A7BC9', x:35, y:85, lieux:['Palais','Université','Bibliothèque','Résidences des savants','Bureau du directeur']},
  {id:'circcus', nom:'The Circcus', icon:'🎉', dieu:'Kye Rong · Allégresse', color:'#C94AC9', x:65, y:85, lieux:['Centre commercial','Palais','Parc d\'attraction']},
  {id:'essaim', nom:'L\'Essaim', icon:'🦟', dieu:'Ran · Propagation', color:'#7AC94A', x:15, y:75, lieux:['Palais','La Ruche']},
  {id:'lune', nom:'Empire Lunaire', icon:'🌹', dieu:'Jinshi · Beauté', color:'#C94A7A', x:65, y:25, lieux:['Cour intérieure','Palais','Théâtre']},
  {id:'concordia', nom:'Concordia', icon:'🎺', dieu:'Zhu Jin · Harmonie', color:'#C9A84C', x:65, y:55, lieux:['Palais','Citadelle des voyageurs','Hôtel','Salle de concert']},
  {id:'mujiland', nom:'Mujiland', icon:'🕳', dieu:'Muji · Nihilité', color:'#888880', x:88, y:20, lieux:['La Ville','Chez Muji','Mafia de la Bougie','Buggy Land']},
  {id:'falconia', nom:'Falconia', icon:'🎯', dieu:'Griffith · Chasse', color:'#C97A4A', x:85, y:55, lieux:['Siège militaire','Palais','Tribunal céleste']},
  {id:'planete43', nom:'Dimension 43', icon:'❓', dieu:'Kye Sook · Énigmata', color:'#AFA9EC', x:85, y:85, lieux:['Vide intersidéral (prison de Kye Sook)']},
  {id:'jardin', nom:'Jardin Mémoire', icon:'⌛', dieu:'Undertaker · Souvenir', color:'#9B96B8', x:70, y:10, lieux:['Archives mémorielles','Le Seuil']},
  {id:'kuya', nom:'Territoire Kuya', icon:'🫗', dieu:'Kuya · Voracité', color:'#C9A84C', x:30, y:10, lieux:['Terres informes','Le Cratère']},
  {id:'entreterre', nom:'Entre-Terre', icon:'🩸', dieu:'Marika · Ordre brisé', color:'#8B2020', x:50, y:65, lieux:['Leyndell — Palais royal','Manoir du Lion Rouge (Mihawk)','Palais de l\'Empaleur (Messmer)','Mohgwyn — Palais (Mohg)','Table Ronde']}
];

const QUETES_DATA = [
  {id:'q_43',royaume:'axiom',nom:'43',rumeur:'Une fonctionnaire...',desc:'Une fonctionnaire d\'Axiøm...',hint:'Penser à elle...',prereqs:[],type:'principale'},
  {id:'q_jufa',royaume:'akropis',nom:'La Destruction',rumeur:'Le seigneur...',desc:'Intégrez-vous à Akropis...',hint:'La force brute...',prereqs:[],type:'principale'},
  {id:'q_muji',royaume:'mujiland',nom:'La Nihilité',rumeur:'Le royaume...',desc:'Mujiland résiste...',hint:'Cherchez ce qui ne colle pas...',prereqs:[],type:'principale'},
];

let quetesState = {};
let isAdmin = false;
let activeFilter = 'all';

async function loadState() {
  const saved = localStorage.getItem(LOCAL_KEY);
  if (saved) { try { quetesState = JSON.parse(saved); } catch(e){} }
  renderCarte();
  renderZones();
}

function renderCarte() {
  const container = document.getElementById('map-pins-container');
  container.innerHTML = '';
  
  ZONES_DATA.forEach(z => {
    const quetes = QUETES_DATA.filter(q => q.royaume === z.id);
    const actives = quetes.filter(q => quetesState[q.id] === 'active').length;
    const rumeurs = quetes.filter(q => quetesState[q.id] === 'rumeur').length;
    
    let statusBadge = '';
    if (actives > 0) statusBadge = `<div class="pin-status" style="color:var(--gold); border-color:var(--gold);">${actives}</div>`;
    else if (rumeurs > 0) statusBadge = `<div class="pin-status" style="color:var(--violet); border-color:var(--violet);">?</div>`;

    const pin = document.createElement('div');
    pin.className = 'map-pin';
    pin.style.left = `${z.x}%`;
    pin.style.top = `${z.y}%`;
    pin.style.color = z.color;
    
    // Au clic, on ouvre le zoom de la planète
    pin.onclick = () => openMapZoom(z.id);

    pin.innerHTML = `
      ${statusBadge}
      <div class="pin-dot"></div>
      <div class="pin-label">${z.nom}</div>
    `;
    container.appendChild(pin);
  });
}

// GESTION DU ZOOM
function openMapZoom(zoneId) {
  const z = ZONES_DATA.find(x => x.id === zoneId);
  if(!z) return;
  
  // Effet visuel sur la carte
  document.getElementById('interactive-map').classList.add('zoomed');
  
  // Remplir les infos du zoom
  const overlay = document.getElementById('map-zoom-overlay');
  document.getElementById('zoom-icon').textContent = z.icon;
  document.getElementById('zoom-icon').style.color = z.color;
  document.getElementById('zoom-title').textContent = z.nom;
  document.getElementById('zoom-title').style.color = z.color;
  document.getElementById('zoom-subtitle').textContent = z.dieu;
  
  const lieuxGrid = document.getElementById('zoom-lieux-grid');
  lieuxGrid.innerHTML = z.lieux.map(l => `<div class="zoom-lieu-card" style="color:${z.color}">${l}</div>`).join('');
  
  // Bouton pour aller voir les quêtes de cette zone
  document.getElementById('btn-zoom-quests').onclick = () => {
    closeMapZoom();
    showPage('journal');
    setFilter(z.id);
  };
  
  // Afficher l'overlay
  overlay.style.backgroundColor = `${z.color}15`; // Teinte très légère du fond
  overlay.classList.add('active');
}

function closeMapZoom() {
  document.getElementById('interactive-map').classList.remove('zoomed');
  document.getElementById('map-zoom-overlay').classList.remove('active');
}

// RESTE DU CODE IDENTIQUE...
function setFilter(f) { activeFilter=f; renderJournal(); }

function renderJournal() {
  const list = document.getElementById('journal-list');
  const visible = QUETES_DATA.filter(q => (activeFilter==='all' || q.royaume===activeFilter) && quetesState[q.id]!=='hidden');
  list.innerHTML = visible.length ? visible.map(q => `<div class="journal-entry"><div class="je-header"><div class="je-title">${q.nom}</div></div></div>`).join('') : '<p style="text-align:center;color:var(--text-faint);padding:2rem;">Aucune quête connue ici.</p>';
}

function renderZones() {
  const grid = document.getElementById('zones-grid');
  if(!grid) return;
  grid.innerHTML = ZONES_DATA.map(z => `
    <div class="zone-card" onmouseover="this.style.borderColor='${z.color}'" onmouseout="this.style.borderColor='var(--border)'">
      <div class="zone-header" style="background:${z.color}18;"><span class="zone-icon">${z.icon}</span><div><div class="zone-name" style="color:${z.color};">${z.nom}</div><div class="zone-dieu">${z.dieu}</div></div></div>
      <div class="zone-lieux">${z.lieux.map(l=>`<div class="zone-lieu">${l}</div>`).join('')}</div>
    </div>`).join('');
}

function showPage(p) {
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  const tabs = {carte:0,journal:1,zones:2};
  if(tabs[p]!==undefined) document.querySelectorAll('.nav-tab')[tabs[p]].classList.add('active');
  if(p==='journal') renderJournal();
}

function openAdmin(){document.getElementById('modal-login').classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

loadState();
</script>
</body>
</html>
