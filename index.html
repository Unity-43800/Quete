<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiøm — Journal des Voies</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
--void:#080610;--deep:#0E0B1A;--surface:#14102A;--panel:#1A1530;
--border:#2E2550;--gold:#C9A84C;--gold-light:#E8C96A;--gold-dim:#7A5E1A;
--violet:#7F77DD;--violet-light:#AFA9EC;--violet-dim:#3C3489;
--text:#E8E4F4;--text-dim:#9B96B8;--text-faint:#514D6E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--void);color:var(--text);font-family:'Crimson Text',Georgia,serif;min-height:100vh;overflow-x:hidden;}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) var(--delay,0s) infinite alternate ease-in-out;}
@keyframes twinkle{from{opacity:.06}to{opacity:.55}}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(8,6,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;}
.nav-logo{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.1em;color:var(--gold);}
.nav-tabs{display:flex;gap:.2rem;}
.nav-tab{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .6rem;border-radius:6px;border:1px solid transparent;background:none;color:var(--text-faint);cursor:pointer;transition:all .2s;}
.nav-tab.active,.nav-tab:hover{color:var(--gold);border-color:var(--gold-dim);background:rgba(201,168,76,.07);}
.page{display:none;position:relative;z-index:1;padding-top:66px;min-height:100vh;}
.page.active{display:block;}
.page-h{text-align:center;padding:2rem 1.25rem 1.5rem;}
.page-h h1{font-family:'Cinzel',serif;font-size:clamp(22px,5vw,42px);font-weight:700;background:linear-gradient(135deg,var(--gold-light),var(--violet-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;}

/* GALAXIE & PLANETES */
.map-container {
  position: relative; width: 95%; max-width: 1100px; aspect-ratio: 16/10; margin: 0 auto;
  background: radial-gradient(circle at center, #1A1530 0%, #080610 100%);
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
}
.galaxy-view { position: absolute; inset: 0; transition: opacity 0.4s; }
.galaxy-view.hidden { opacity: 0; pointer-events: none; }

.planet-node {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s;
}
.planet-node:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 10; }
.planet-sphere {
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, currentColor, transparent 80%);
  box-shadow: inset -10px -10px 20px rgba(0,0,0,0.6), 0 0 15px currentColor;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; color: rgba(255,255,255,0.8);
}
.planet-label {
  margin-top: 8px; font-family: 'Cinzel', serif; font-size: 11px; color: var(--text);
  background: rgba(8,6,16,0.85); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); white-space: nowrap;
}

/* VUE SURFACE (INTERIEUR PLANETE) */
.surface-view {
  position: absolute; inset: 0; background: rgba(8,6,16,0.95); backdrop-filter: blur(10px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 20;
}
.surface-view.active { opacity: 1; pointer-events: auto; }
.sv-header { position: absolute; top: 1.5rem; left: 1.5rem; right: 1.5rem; display: flex; justify-content: space-between; align-items: flex-start; z-index: 30; }
.sv-btn { font-family: 'Cinzel', serif; font-size: 10px; text-transform: uppercase; padding: 0.5rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); border-radius: 6px; cursor: pointer; }
.sv-btn:hover { background: rgba(255,255,255,0.1); }
.sv-title { text-align: center; }
.sv-title h2 { font-family: 'Cinzel', serif; font-size: 24px; margin-bottom: 0.2rem; }
.sv-title p { font-size: 12px; color: var(--text-dim); font-style: italic; }

.giant-planet {
  width: 70%; aspect-ratio: 1; max-width: 500px; border-radius: 50%;
  position: relative; box-shadow: inset -20px -20px 50px rgba(0,0,0,0.8);
  border: 1px solid rgba(255,255,255,0.1);
}
.location-pin {
  position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s;
}
.location-pin:hover { transform: translate(-50%, -50%) scale(1.2); z-index: 10; }
.loc-dot { width: 12px; height: 12px; border-radius: 50%; background: white; box-shadow: 0 0 10px white; border: 2px solid var(--void); }
.loc-label { margin-top: 5px; font-size: 11px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); }

/* RESTE DES STYLES POUR LE JOURNAL (Identique) */
.journal-entry{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;overflow:hidden;}
.je-header{padding:.9rem 1.1rem;display:flex;align-items:center;gap:.75rem;cursor:pointer;}
.je-title{font-family:'Cinzel',serif;font-size:13px;color:var(--text);flex:1;}
.je-meta{font-size:11px;color:var(--text-faint);}

@media(max-width:700px){
  .map-container { aspect-ratio: 1/1.2; }
  .giant-planet { width: 90%; }
}
</style>
</head>
<body>
<div id="stars"></div>
<nav>
  <span class="nav-logo">Axiøm</span>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('carte')">🗺 Carte</button>
    <button class="nav-tab" onclick="showPage('journal')">📖 Journal</button>
  </div>
</nav>

<!-- PAGE CARTE -->
<div class="page active" id="page-carte">
  <div class="page-h">
    <h1>La Galaxie</h1>
    <p>Cliquez sur une planète pour explorer ses lieux.</p>
  </div>
  
  <div class="map-container" id="map-container">
    <!-- NIVEAU 1 : GALAXIE -->
    <div class="galaxy-view" id="galaxy-view"></div>
    
    <!-- NIVEAU 2 : INTERIEUR DE LA PLANETE -->
    <div class="surface-view" id="surface-view">
      <div class="sv-header">
        <button class="sv-btn" onclick="closePlanet()">⟵ Retour</button>
        <div class="sv-title">
          <h2 id="sv-name">Nom</h2>
          <p id="sv-god">Dieu</p>
        </div>
        <button class="sv-btn" id="sv-quest-btn" style="color:var(--gold); border-color:var(--gold-dim);">Quêtes ▾</button>
      </div>
      <div class="giant-planet" id="giant-planet"></div>
    </div>
  </div>
</div>

<!-- PAGE JOURNAL -->
<div class="page" id="page-journal">
  <div class="page-h"><h1>Journal des Voies</h1></div>
  <div style="max-width:720px;margin:0 auto;padding:0 1.25rem 1rem;" id="journal-list">
    <p style="text-align:center; color:var(--text-faint);">Connectez vos quêtes ici.</p>
  </div>
</div>

<script>
// ETOILES DE FOND
const container = document.getElementById('stars');
for(let i=0;i<80;i++){
  const s=document.createElement('div');s.className='star';
  s.style.width=Math.random()*2+1+'px';s.style.height=s.style.width;
  s.style.top=Math.random()*100+'%';s.style.left=Math.random()*100+'%';
  s.style.setProperty('--d',Math.random()*3+2+'s');
  container.appendChild(s);
}

// DONNEES (Planètes et leurs lieux)
const ZONES_DATA = [
  {id:'axiom', nom:'Axiøm', icon:'🏛', dieu:'Kenjaku · Imu', color:'#7F77DD', size:80, x:50, y:40, lieux:['Palais royal','Cour dorée','Forge souterraine','Place originelle','Citadelle des dieux','Pavillon','Quartier 43']},
  {id:'akropis', nom:'Akropis', icon:'⚔', dieu:'Ju Fa', color:'#C94A4A', size:60, x:20, y:45, lieux:['Palais royal','Place exécutions','Arène','Aile serviteurs','Onigashima']},
  {id:'allpink', nom:'All Pink', icon:'🌿', dieu:'Tao Fa', color:'#4AC97A', size:55, x:15, y:20, lieux:['Hôpital','Palais','Jardin bénédictions']},
  {id:'atlantis', nom:'Atlantis', icon:'🧠', dieu:'Gui Fa', color:'#4A7BC9', size:65, x:35, y:85, lieux:['Palais','Université','Bibliothèque','Résidences','Bureau']},
  {id:'falconia', nom:'Falconia', icon:'🎯', dieu:'Griffith', color:'#C97A4A', size:70, x:85, y:55, lieux:['Siège militaire','Palais','Tribunal']},
  {id:'mujiland', nom:'Mujiland', icon:'🕳', dieu:'Muji', color:'#888880', size:50, x:88, y:20, lieux:['La Ville','Chez Muji','Mafia Bougie','Buggy Land']}
];

// INITIALISATION GALAXIE
const galaxyView = document.getElementById('galaxy-view');

ZONES_DATA.forEach(z => {
  const node = document.createElement('div');
  node.className = 'planet-node';
  node.style.left = z.x + '%';
  node.style.top = z.y + '%';
  node.style.color = z.color;
  
  // Ouvre la planète au clic
  node.onclick = () => openPlanet(z);
  
  node.innerHTML = `
    <div class="planet-sphere" style="width:${z.size}px; height:${z.size}px; background-color:${z.color}33;">${z.icon}</div>
    <div class="planet-label">${z.nom}</div>
  `;
  galaxyView.appendChild(node);
});

// GESTION SURFACE (Intérieur de la planète)
function openPlanet(zone) {
  document.getElementById('galaxy-view').classList.add('hidden');
  const surface = document.getElementById('surface-view');
  
  // Infos Header
  document.getElementById('sv-name').textContent = zone.nom;
  document.getElementById('sv-name').style.color = zone.color;
  document.getElementById('sv-god').textContent = zone.dieu;
  
  // Dessin de la planète géante
  const giant = document.getElementById('giant-planet');
  giant.style.backgroundColor = `${zone.color}22`; // Teinte transparente
  giant.style.boxShadow = `inset -20px -20px 50px rgba(0,0,0,0.8), 0 0 100px ${zone.color}44`;
  giant.innerHTML = ''; // Reset des anciens lieux
  
  // Répartition géométrique des lieux en cercle à l'intérieur
  const total = zone.lieux.length;
  zone.lieux.forEach((lieu, index) => {
    // Calcul mathématique pour répartir les points en cercle
    const angle = (index / total) * Math.PI * 2;
    const radius = 35; // % de distance par rapport au centre
    const posX = 50 + radius * Math.cos(angle);
    const posY = 50 + radius * Math.sin(angle);
    
    const pin = document.createElement('div');
    pin.className = 'location-pin';
    pin.style.left = posX + '%';
    pin.style.top = posY + '%';
    
    // Action au clic sur un lieu
    pin.onclick = () => alert(`Vous avez cliqué sur : ${lieu}\n(Lien vers le journal de la zone en développement)`);
    
    pin.innerHTML = `
      <div class="loc-dot" style="background:${zone.color}; box-shadow:0 0 10px ${zone.color}"></div>
      <div class="loc-label">${lieu}</div>
    `;
    giant.appendChild(pin);
  });
  
  // Bouton quêtes
  document.getElementById('sv-quest-btn').onclick = () => {
    showPage('journal');
    // Ici on pourrait filtrer le journal
  };

  surface.classList.add('active');
}

function closePlanet() {
  document.getElementById('surface-view').classList.remove('active');
  document.getElementById('galaxy-view').classList.remove('hidden');
}

// NAVIGATION
function showPage(p) {
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(p==='carte') document.querySelectorAll('.nav-tab')[0].classList.add('active');
  if(p==='journal') document.querySelectorAll('.nav-tab')[1].classList.add('active');
}
</script>
</body>
</html>
